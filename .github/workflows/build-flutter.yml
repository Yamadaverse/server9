name: Build APK - BOTBUILD VIP3 Stable

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 'Job ID from BOTBUILD VIP3'
        required: true
        type: string
      userId:
        description: 'Telegram User ID'
        required: true
        type: string
      payload:
        description: 'Build payload JSON (zip or Web2APK)'
        required: true
        type: string

concurrency:
  group: botbuild-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      JOB_ID: ${{ github.event.inputs.jobId }}
      TELEGRAM_USER_ID: ${{ github.event.inputs.userId }}
      PAYLOAD_JSON: ${{ github.event.inputs.payload }}
      GH_TOKEN: ${{ github.token }}
      TARGET_PLATFORMS: android-arm,android-arm64

    steps:
      - name: Checkout worker repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Parse and validate payload
        id: payload
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ -z "${PAYLOAD_JSON:-}" ]]; then
            echo '::error::Payload kosong.'
            exit 1
          fi
          printf '%s' "$PAYLOAD_JSON" > payload.json
          if ! jq -e 'type == "object"' payload.json >/dev/null; then
            echo '::error::Payload bukan JSON object yang valid.'
            exit 1
          fi

          MODE="$(jq -r '.mode // empty' payload.json)"
          if [[ -z "$MODE" ]]; then
            if jq -e 'has("appName") or has("iconUrl")' payload.json >/dev/null; then
              MODE=url
            else
              MODE=zip
            fi
          fi
          if [[ "$MODE" != zip && "$MODE" != url ]]; then
            echo "::error::Mode tidak didukung: $MODE"
            exit 1
          fi

          BUILD_TYPE="$(jq -r '.buildType // .build_type // "release"' payload.json)"
          if [[ "$BUILD_TYPE" != release && "$BUILD_TYPE" != debug ]]; then
            echo "::error::Build type tidak valid: $BUILD_TYPE (gunakan release/debug)"
            exit 1
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "build_type=$BUILD_TYPE" >> "$GITHUB_OUTPUT"
          echo "Build request: mode=$MODE, type=$BUILD_TYPE, job=$JOB_ID, user=$TELEGRAM_USER_ID"

      - name: Download ZIP project
        if: steps.payload.outputs.mode == 'zip'
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_URL="$(jq -r '.zipAssetUrl // .url // empty' payload.json)"
          if [[ -z "$SOURCE_URL" || "$SOURCE_URL" == null ]]; then
            echo '::error::Payload mode=zip wajib memiliki zipAssetUrl atau url.'
            exit 1
          fi

          mkdir -p project_raw
          echo 'Downloading source ZIP...'
          if [[ "$SOURCE_URL" == *"api.github.com/repos/"* ]]; then
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/octet-stream' \
              "$SOURCE_URL" -o project.zip
          elif [[ "$SOURCE_URL" == *"github.com/"* ]]; then
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$SOURCE_URL" -o project.zip
          else
            curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
              "$SOURCE_URL" -o project.zip
          fi

          test -s project.zip
          unzip -tq project.zip
          unzip -q project.zip -d project_raw
          echo "ZIP downloaded: $(du -h project.zip | cut -f1)"

      - name: Generate Web2APK Flutter project
        if: steps.payload.outputs.mode == 'url'
        shell: bash
        run: |
          set -Eeuo pipefail
          WEB_URL="$(jq -r '.url // empty' payload.json)"
          APP_NAME="$(jq -r '.appName // "WebApp"' payload.json)"
          ICON_URL="$(jq -r '.iconUrl // empty' payload.json)"
          if [[ -z "$WEB_URL" ]]; then
            echo '::error::Payload mode=url wajib memiliki url website.'
            exit 1
          fi
          if [[ "$WEB_URL" != https://* && "$WEB_URL" != http://* ]]; then
            echo '::error::URL website harus diawali http:// atau https://'
            exit 1
          fi
          python3 - "$APP_NAME" "$WEB_URL" <<'PY'
          import json, pathlib, re, sys
          app_name, web_url = sys.argv[1], sys.argv[2]
          safe = re.sub(r'[^a-z0-9_]+', '_', app_name.lower()).strip('_') or 'webapp'
          if safe[0].isdigit(): safe = 'app_' + safe
          pathlib.Path('project_raw').mkdir(exist_ok=True)
          pathlib.Path('project_name.txt').write_text(safe)
          pathlib.Path('app_name.json').write_text(json.dumps(app_name, ensure_ascii=False))
          pathlib.Path('web_url.json').write_text(json.dumps(web_url, ensure_ascii=False))
          PY
          SAFE_NAME="$(cat project_name.txt)"
          flutter create --org com.youngit --project-name "$SAFE_NAME" --platforms=android --no-pub "project_raw/$SAFE_NAME"
          cd "project_raw/$SAFE_NAME"
          flutter pub add webview_flutter

          APP_NAME_JSON="$(cat ../../app_name.json)"
          WEB_URL_JSON="$(cat ../../web_url.json)"
          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          const String appTitle = __APP_NAME__;
          const String startUrl = __WEB_URL__;

          Future<void> setFullscreen() async {
            await SystemChrome.setEnabledSystemUIMode(SystemUiMode.immersiveSticky);
            await SystemChrome.setPreferredOrientations(const [
              DeviceOrientation.portraitUp,
              DeviceOrientation.portraitDown,
              DeviceOrientation.landscapeLeft,
              DeviceOrientation.landscapeRight,
            ]);
          }

          void main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await setFullscreen();
            runApp(const Web2ApkApp());
          }

          class Web2ApkApp extends StatelessWidget {
            const Web2ApkApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              title: appTitle,
              theme: ThemeData(useMaterial3: true, colorSchemeSeed: Colors.blue),
              home: const WebHomePage(),
            );
          }

          class WebHomePage extends StatefulWidget {
            const WebHomePage({super.key});
            @override
            State<WebHomePage> createState() => _WebHomePageState();
          }

          class _WebHomePageState extends State<WebHomePage> with WidgetsBindingObserver {
            late final WebViewController controller;
            bool loading = true;
            bool hasError = false;

            Future<void> _reload() async {
              if (!mounted) return;
              setState(() { loading = true; hasError = false; });
              await controller.loadRequest(Uri.parse(startUrl));
            }

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(const Color(0xFFFFFFFF))
                ..enableZoom(true)
                ..setNavigationDelegate(NavigationDelegate(
                  onPageStarted: (_) {
                    if (mounted) setState(() { loading = true; hasError = false; });
                  },
                  onPageFinished: (_) {
                    if (mounted) setState(() { loading = false; hasError = false; });
                  },
                  onWebResourceError: (error) {
                    final errCode = error.errorCode;
                    const fatalCodes = {-2, -6, -8, -14};
                    if (error.isForMainFrame == true && fatalCodes.contains(errCode) && mounted) {
                      setState(() { loading = false; hasError = true; });
                    }
                  },
                  onNavigationRequest: (request) => NavigationDecision.navigate,
                ));

              controller.loadRequest(Uri.parse(startUrl));
            }

            Future<bool> _onWillPop() async {
              if (await controller.canGoBack()) {
                await controller.goBack();
                return false;
              }
              return true;
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) setFullscreen();
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              super.dispose();
            }

            @override
            Widget build(BuildContext context) => PopScope(
              canPop: false,
              onPopInvokedWithResult: (didPop, _) async {
                if (!didPop) await _onWillPop();
              },
              child: Scaffold(
                backgroundColor: Colors.white,
                body: SizedBox.expand(
                  child: Stack(
                    fit: StackFit.expand,
                    children: [
                      WebViewWidget(controller: controller),
                      if (loading)
                        const IgnorePointer(
                          child: ColoredBox(
                            color: Colors.white,
                            child: Center(child: CircularProgressIndicator()),
                          ),
                        ),
                      if (hasError)
                        ColoredBox(
                          color: Colors.white,
                          child: Center(
                            child: Column(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(Icons.wifi_off, size: 48, color: Colors.grey),
                                const SizedBox(height: 12),
                                const Text('Website gagal dimuat.'),
                                const SizedBox(height: 12),
                                ElevatedButton(
                                  onPressed: _reload,
                                  child: const Text('Muat ulang'),
                                ),
                              ],
                            ),
                          ),
                        ),
                    ],
                  ),
                ),
              ),
            );
          }
          DART
          python3 - "$APP_NAME_JSON" "$WEB_URL_JSON" <<'PY'
          import pathlib, sys
          p = pathlib.Path('lib/main.dart')
          s = p.read_text()
          s = s.replace('__APP_NAME__', sys.argv[1]).replace('__WEB_URL__', sys.argv[2])
          p.write_text(s)
          PY

          # FIX UTAMA: permission INTERNET wajib ada di manifest utama.
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>#' "$MANIFEST"
          fi

          WEB_URL_PLAIN="$(cat ../../web_url.json | jq -r '.')"
          if [[ "$WEB_URL_PLAIN" == http://* ]]; then
            echo '::warning::URL menggunakan http://_NETWORK_STATE"/>#' "$MANIFEST"
          fi

          WEB_URL_PLAIN="$(cat ../../web_url.json | jq -r '.')"
          if [[ "$WEB_URL_PLAIN" == http://* ]]; then
            echo '::warning::URL menggunakan http://, mengaktifkan cleartextTraffic.'
            sed -i 's#<application#<application android:usesCleartextTraffic="true"#' "$MANIFEST"
            mkdir -p android/app/src/main/res/xml
            cat > android/app/src/main/res/xml/network_security_config.xml <<'NSC'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true" />
          </network-security-config>
          NSC
            sed -i 's#android:usesCleartextTraffic="true"#android:usesCleartextTraffic="true" android:networkSecurityConfig="@xml/network_security_config"#' "$MANIFEST"
          fi

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            echo '::error::Gagal memasukkan permission INTERNET ke AndroidManifest.xml'
            cat "$MANIFEST"
            exit 1
          fi
          echo "AndroidManifest.xml final:"
          cat "$MANIFEST"
          cd ../..

          if [[ -n "$ICON_URL" ]]; then
            mkdir -p "project_raw/$SAFE_NAME/assets"
            if [[ "$ICON_URL" == *"github.com/"* || "$ICON_URL" == *"api.github.com/repos/"* ]]; then
              curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
                -H "Authorization: Bearer $GH_TOKEN" "$ICON_URL" \
                -o "project_raw/$SAFE_NAME/assets/app_icon.png" || true
            else
              curl --fail --location --retry 2 --connect-timeout 20 --max-time 120 \
                "$ICON_URL" -o "project_raw/$SAFE_NAME/assets/app_icon.png" || true
            fi
            if [[ -s "project_raw/$SAFE_NAME/assets/app_icon.png" ]]; then
              cd "project_raw/$SAFE_NAME"
              flutter pub add --dev flutter_launcher_icons
              cat > flutter_launcher_icons.yaml <<'ICON'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: assets/app_icon.png
          ICON
              dart run flutter_launcher_icons || echo '::warning::Launcher icon gagal dibuat; lanjut dengan icon default.'
              cd ../..
            else
              echo '::warning::Icon URL gagal diunduh; menggunakan icon default.'
            fi
          fi
          echo "Web2APK project generated: project_raw/$SAFE_NAME"

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -Eeuo pipefail
          PUBSPEC="$(find project_raw -type f -name pubspec.yaml -not -path '*/build/*' -not -path '*/.dart_tool/*' -print -quit)"
          if [[ -n "$PUBSPEC" ]]; then
            PROJECT_DIR="$(dirname "$PUBSPEC")"
            echo 'type=flutter' >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo 'has_wrapper=true' >> "$GITHUB_OUTPUT"
            echo "Flutter project detected: $PROJECT_DIR"
            exit 0
          fi

          GRADLEW="$(find project_raw -type f -name gradlew -not -path '*/build/*' -print -quit)"
          if [[ -n "$GRADLEW" ]]; then
            PROJECT_DIR="$(dirname "$GRADLEW")"
            echo 'type=gradle' >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo 'has_wrapper=true' >> "$GITHUB_OUTPUT"
            echo "Gradle project detected: $PROJECT_DIR"
            exit 0
          fi

          SETTINGS="$(find project_raw -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/build/*' -print -quit)"
          if [[ -n "$SETTINGS" ]]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
            echo 'type=gradle' >> "$GITHUB_OUTPUT"
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
            echo 'has_wrapper=false' >> "$GITHUB_OUTPUT"
            echo "Gradle project without wrapper detected: $PROJECT_DIR"
            exit 0
          fi

          echo '::error::Project tidak dikenali. ZIP harus berisi pubspec.yaml (Flutter) atau gradlew/settings.gradle (Android Gradle).'
          find project_raw -maxdepth 4 -type f | head -100
          exit 1

      - name: Ensure INTERNET permission (ZIP mode)
        if: steps.detect.outputs.type == 'flutter'
        shell: bash
        run: |
          set -Eeuo pipefail
          PROJECT_DIR="${{ steps.detect.outputs.dir }}"
          MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
          if [[ -f "$MANIFEST" ]] && ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>#' "$MANIFEST"
            echo "::warning::Permission INTERNET ditambahkan otomatis ke $MANIFEST"
            grep -n 'uses-permission' "$MANIFEST" || true
          fi

      - name: Setup Gradle for projects without wrapper
        if: steps.detect.outputs.type == 'gradle' && steps.detect.outputs.has_wrapper == 'false'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache Flutter packages
        if: steps.detect.outputs.type == 'flutter'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('project_raw/**/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Build Flutter APK
        if: steps.detect.outputs.type == 'flutter'
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -Eeuo pipefail
          flutter config --no-analytics
          flutter pub get
          flutter build apk --"$BUILD_TYPE" \
            --target-platform="$TARGET_PLATFORMS" \
            --no-tree-shake-icons 2>&1 | tee build.log

      - name: Build Native Android APK
        if: steps.detect.outputs.type == 'gradle'
        working-directory: ${{ steps.detect.outputs.dir }}
        shell: bash
        env:
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -Eeuo pipefail
          if [[ "$BUILD_TYPE" == debug ]]; then TASK=assembleDebug; else TASK=assembleRelease; fi
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew "$TASK" --no-daemon --stacktrace 2>&1 | tee build.log
          else
            gradle "$TASK" --no-daemon --stacktrace 2>&1 | tee build.log
          fi

      - name: Locate APK
        id: locate
        if: success()
        shell: bash
        env:
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          PROJECT_DIR: ${{ steps.detect.outputs.dir }}
          BUILD_TYPE: ${{ steps.payload.outputs.build_type }}
        run: |
          set -Eeuo pipefail
          APK=""
          if [[ "$PROJECT_TYPE" == flutter ]]; then
            APK="$(find "$PROJECT_DIR" -type f -name "app-$BUILD_TYPE.apk" -path '*/outputs/flutter-apk/*' -print -quit)"
          fi
          if [[ -z "$APK" ]]; then
            APK="$(find project_raw -type f -name '*.apk' \
              -not -path '*/intermediates/*' -not -path '*/tmp/*' \
              -not -path '*/.gradle/*' -print -quit)"
          fi
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo '::error::APK tidak ditemukan atau file kosong setelah build.'
            exit 1
          fi
          SIZE="$(stat -c '%s' "$APK")"
          if (( SIZE < 1000 )); then
            echo "::error::APK terlalu kecil: $SIZE bytes"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK found: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.jobId }}
          path: |
            project_raw/**/build.log
          if-no-files-found: ignore
          retention-days: 1
